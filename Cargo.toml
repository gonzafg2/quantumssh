# QuantumSSH workspace root.
#
# Two crates, flat layout (ADR-0017): `quantumssh` is the thin binary
# entrypoint; `quantumssh-core` is the library where all server logic
# lives so integration tests can exercise it without the binary.

[workspace]
resolver = "3"
members  = ["crates/quantumssh", "crates/quantumssh-core"]

# Default values inherited by every crate that opts in via
# `package.<field>.workspace = true`.
[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
authors      = ["QuantumSSH Contributors"]
repository   = "https://github.com/gonzafg2/quantumssh"
homepage     = "https://quantumssh.org"
rust-version = "1.92"

# Centralised dependency versions. Each crate declares
# `<dep>.workspace = true` (adding the features it needs) to inherit
# the version pinned here. Pins are added the milestone they are first
# used, each justified in its PR; the cryptographic pins are fixed by
# RFC-0003/ADR-0019 and land with the kex milestone.
[workspace.dependencies]
tokio              = { version = "~1.51", default-features = false } # ADR-0022 (RFC-0004): tilde keeps us on the 1.51.x LTS line, per Tokio's own LTS guidance
tracing            = { version = "0.1", default-features = false }  # ADR-0024: the facade the library emits through
tracing-subscriber = { version = "0.3", default-features = false }  # ADR-0024: constructed only by the binary
getrandom          = { version = "0.3", default-features = false }  # OS randomness: BPP padding (RFC 4253 §6), KEXINIT cookie (M2)

# Cryptographic primitive layer — pinned by RFC-0003 §"Guide-level
# explanation" and ADR-0019. All pure-Rust, no FFI; `hmac` is
# deliberately absent (ADR-0021: AEAD-only, no exercised MAC path).
ml-kem        = { version = "0.3.0", default-features = false, features = ["zeroize"] }            # ADR-0019
x25519-dalek  = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core", "zeroize"] }
sha2          = { version = "0.10", default-features = false }
zeroize       = { version = "1", default-features = false, features = ["zeroize_derive"] }

# AEAD transport layer (M3). `chacha20-poly1305@openssh.com` cannot be
# expressed through the IETF `chacha20poly1305` AEAD crate (96-bit
# nonce, single key): the OpenSSH format takes two 256-bit keys, a
# 64-bit sequence-number nonce, and encrypts the length field
# separately — it is assembled from the loose primitives instead
# (same RustCrypto org). `aes256-gcm@openssh.com` is RFC 5647 over
# the standard AEAD.
chacha20 = { version = "0.9", default-features = false, features = ["zeroize"] }  # ChaCha20Legacy: the 64-bit-nonce djb variant OpenSSH uses
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
aes-gcm  = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Declared ONLY to switch on its `zeroize` feature (Cargo feature
# unification): `aes-gcm/zeroize` erases the GHASH key on drop but
# does not forward to `aes`, whose round-key schedule is the bulk of
# the key material (threat model §4.3). No first-party code imports
# this crate.
aes      = { version = "0.8.4", default-features = false, features = ["zeroize"] }
subtle   = { version = "2", default-features = false }  # constant-time Poly1305 tag comparison

# Lints applied to every crate in the workspace via
# `lints.workspace = true` in each crate's manifest.
#
# `unsafe_code = "forbid"` (ADR-0018): no first-party `unsafe`, no
# `#[allow]` escape hatch, promoted from "deny" in the same PR that
# adds the first crate — exactly as the ADR requires.
[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"
unused       = { level = "warn", priority = -1 } # lint group: lower priority so individual lints can override

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
