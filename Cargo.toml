# QuantumSSH workspace root.
#
# Two crates, flat layout (ADR-0017): `quantumssh` is the thin binary
# entrypoint; `quantumssh-core` is the library where all server logic
# lives so integration tests can exercise it without the binary.

[workspace]
resolver = "3"
members  = ["crates/quantumssh", "crates/quantumssh-core"]

# Default values inherited by every crate that opts in via
# `package.<field>.workspace = true`.
[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
authors      = ["QuantumSSH Contributors"]
repository   = "https://github.com/gonzafg2/quantumssh"
homepage     = "https://quantumssh.org"
rust-version = "1.92"

# Centralised dependency versions. Each crate declares
# `<dep>.workspace = true` (adding the features it needs) to inherit
# the version pinned here. Pins are added the milestone they are first
# used, each justified in its PR; the cryptographic pins are fixed by
# RFC-0003/ADR-0019 and land with the kex milestone.
[workspace.dependencies]
tokio              = { version = "~1.51", default-features = false } # ADR-0022 (RFC-0004): tilde keeps us on the 1.51.x LTS line, per Tokio's own LTS guidance
tracing            = { version = "0.1", default-features = false }  # ADR-0024: the facade the library emits through
tracing-subscriber = { version = "0.3", default-features = false }  # ADR-0024: constructed only by the binary
getrandom          = { version = "0.3", default-features = false }  # OS randomness: BPP padding (RFC 4253 §6), KEXINIT cookie (M2)

# Lints applied to every crate in the workspace via
# `lints.workspace = true` in each crate's manifest.
#
# `unsafe_code = "forbid"` (ADR-0018): no first-party `unsafe`, no
# `#[allow]` escape hatch, promoted from "deny" in the same PR that
# adds the first crate — exactly as the ADR requires.
[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"
unused       = { level = "warn", priority = -1 } # lint group: lower priority so individual lints can override

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
