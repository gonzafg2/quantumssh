[package]
name = "quantumssh"
version = "0.0.1"
description = "QuantumSSH server binary: a thin entrypoint (CLI parsing, log subscriber, runtime construction) over quantumssh-core."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
quantumssh-core = { path = "../quantumssh-core", version = "0.0.1" }
# ADR-0022: the binary is the only crate that constructs the runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
# ADR-0024: the binary is the only place a subscriber is constructed.
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json", "ansi"] }
# Threat model section 4.3: the host-key PEM buffer is erased on drop.
zeroize = { workspace = true }

[dev-dependencies]
# `tracing::subscriber::with_default` (scoped test subscriber) is
# behind the `std` feature the runtime dependency leaves off.
tracing = { workspace = true, features = ["std"] }

[lints]
workspace = true
