[package]
name = "quantumssh-core"
version = "0.0.1"
description = "Core library of the QuantumSSH server: transport, key exchange, authentication, and channel layers (greenfield, post-quantum-first)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false # ADR-0017: not published until Phase 3+

[dependencies]
# ADR-0022: the library links the I/O and task features it needs to
# define async fns (`rt` gates `tokio::spawn`/`spawn_blocking`); it
# never constructs a runtime.
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt"] }
# ADR-0024: the library emits through the `tracing` facade only and
# never installs a subscriber.
tracing = { workspace = true }
# OS randomness for protocol fields that must be unpredictable
# (packet padding, the KEXINIT cookie).
getrandom = { workspace = true }
# Cryptographic primitives (RFC-0003 / ADR-0019): the hybrid KEX and
# host-key layer. Protocol code only — primitives come from here.
ml-kem = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# AEAD packet layer (M3): chacha20-poly1305@openssh.com from loose
# primitives, aes256-gcm@openssh.com per RFC 5647.
chacha20 = { workspace = true }
poly1305 = { workspace = true }
aes-gcm = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
# Integration tests construct their own runtime; the library does not.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
