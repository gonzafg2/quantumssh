name: Cargo deny

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny invokes `cargo metadata` internally, which fails on a
      # virtual workspace with no members. Skip the action while the
      # workspace is empty; the guard disappears once `members` is set.
      - name: Detect workspace members
        id: members
        shell: bash
        run: |
          count=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              d = tomllib.load(f)
          print(len(d.get("workspace", {}).get("members", [])))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::notice::Workspace has no members yet; skipping cargo-deny check until the first crate lands."
          fi

      - name: Run cargo-deny
        if: steps.members.outputs.count != '0'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      # ADR-0060 §2: the fuzz package is its own workspace, with its own
      # lockfile, checked against the same deny.toml. Shared packages are
      # aligned to the root versions before every fuzz build, so this
      # check is what covers the fuzz-only ones.
      - name: Run cargo-deny on the fuzz package
        if: steps.members.outputs.count != '0'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: fuzz/Cargo.toml
