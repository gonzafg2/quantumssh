name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Author gate; same-repository head (a collaborator's fork PR is skipped,
    # not checked out next to the OAuth token — the gate opencode.yml
    # applies); and no drafts: the code-review plugin treats a
    # draft as a stopping condition and posts nothing, so the run would
    # only fail the proof step below. ready_for_review re-triggers.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the code-review plugin posts the review
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The code-review plugin is the review's prompt, so it is pinned like
      # the action (#165). The action takes a marketplace as a git URL,
      # cloned at its default branch, or as a local path. Pinning the
      # anthropics/claude-code marketplace would not freeze the plugin:
      # since 2026-10-26 its code-review entry is a git-subdir source on
      # the default branch of anthropics/claude-plugins-official. This step
      # fetches the plugin at one commit and serves it from a one-plugin
      # local marketplace. Claude Code reserves the name
      # claude-plugins-official for Anthropic's GitHub sources, hence
      # quantumssh-review. Dependabot does not track PLUGIN_SHA: bump it
      # deliberately, like the action's SHA.
      - name: Fetch the code-review plugin at a pinned commit
        env:
          PLUGIN_REPO: https://github.com/anthropics/claude-plugins-official.git
          # code-review 1.0.1, the version the run that reviewed #229 used.
          PLUGIN_SHA: f8c5e7a1dcb71b10cb74586224b5401f3de5db28
          MARKETPLACE: ${{ runner.temp }}/claude-review-marketplace
        run: |
          set -euo pipefail
          git init -q "$MARKETPLACE"
          git -C "$MARKETPLACE" sparse-checkout set --no-cone /plugins/code-review/
          git -C "$MARKETPLACE" fetch -q --depth 1 --filter=blob:none "$PLUGIN_REPO" "$PLUGIN_SHA"
          git -C "$MARKETPLACE" checkout -q FETCH_HEAD
          [ "$(git -C "$MARKETPLACE" rev-parse HEAD)" = "$PLUGIN_SHA" ]
          mkdir -p "$MARKETPLACE/.claude-plugin"
          cat > "$MARKETPLACE/.claude-plugin/marketplace.json" <<'EOF'
          {
            "name": "quantumssh-review",
            "owner": { "name": "QuantumSSH" },
            "plugins": [
              { "name": "code-review", "source": "./plugins/code-review" }
            ]
          }
          EOF

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to the v1.0.166 commit (not the floating @v1 tag): an
        # unpinned re-fetch of the action silently regressed the
        # OIDC→app-token exchange on 2026-07-06. Bump this SHA
        # deliberately, the same discipline as the pinned toolchain /
        # Debian snapshot / OpenSSH interop image.
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/claude-review-marketplace
          plugins: 'code-review@quantumssh-review'
          # --comment is the plugin's posting switch: its step 7 reads "If
          # --comment argument was NOT provided, stop here. Do not post any
          # GitHub comments." Without it the review runs fully and prints its
          # findings to the job log only.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # --allowedTools is required for posting: in agent mode (explicit
          # prompt) the action only mounts the github_inline_comment MCP
          # server when that tool is named in the action-level allowed tools
          # (install-mcp-server.ts gates on it); the plugin command's own
          # frontmatter cannot grant it. Without this line the review runs
          # but every posting attempt is denied and nothing reaches the PR.
          # Same form as the action repo's own .github/workflows/claude-review.yml.
          #
          # --disallowedTools "ScheduleWakeup" and `settings` below keep the
          # review from ending its turn with work pending. The plugin splits
          # the review across subagents, and a subagent starts in the
          # background unless configured otherwise: the agent wrote "Waiting
          # for results", ended its turn, the run ended with it, and nothing
          # was posted. That was 9 of the last 40 runs, all red at the proof
          # step below, #229 twice in a row. With
          # CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1 every subagent runs in the
          # foreground and the agent waits for its result; subagents started
          # in one message still run at once (code.claude.com/docs/en/sub-agents,
          # "Run subagents in foreground or background"). ScheduleWakeup
          # would end the turn the same way, with no later turn in CI.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "ScheduleWakeup"
            --model claude-sonnet-4-6
            --append-system-prompt "QuantumSSH is a memory-safe, post-quantum-first SSH server in Rust (pre-alpha). Read CLAUDE.md for the project's review criteria. Classify each PR and apply the right lens: for ADR/RFC docs under docs/adr/ or docs/rfcs/, review the soundness and coherence of the design DECISION against the five MANIFIESTO commitments and the threat model — do NOT hunt for code bugs; for Rust under crates/, apply the hard security rules (no first-party unsafe, no unbounded allocation in the pre-auth path, no legacy crypto or second KEX in the default profile, type-state transport intact, mandated authenticated_identity/executing_uid log fields, key material zeroized); for CI under .github/workflows/, check unpinned actions, excessive token permissions, missing authorization gates and supply-chain risk. Also check that all commit messages follow Conventional Commits: <type>(<optional scope>): <short summary> (types: feat, fix, docs, chore, refactor, test, perf, ci, build, security). A deprecated-but-not-yet-disallowed primitive is NOT legacy: check RFC-0007/RFC-0009 for an open migration window before rejecting one. REPORT FORMAT: read .github/REVIEW-FORMAT.md and follow it exactly — it is the report contract, covering the iteration check against previous comments, the section layout, the severity bands and the confidence threshold. Begin with its step 1: read the existing PR comments and classify earlier issues as resolved, open or partly resolved, before analysing the diff. Every finding cites a CLAUDE.md rule, a threat-model section, or an ADR/RFC; a finding without an anchor is an opinion — drop it. Never report something as missing when your environment cannot observe it: SSH signatures never validate on a runner (gpg.ssh.allowedSignersFile is not configured there), so git log --format=%G? returns N or E for every commit, signed or not — check .commit.verification.verified from the GitHub API, which is what branch protection enforces. Absence of evidence in CI is not evidence of absence; if you cannot verify something, say so as a limitation instead of reporting it as a finding."
          # A variable of the Claude Code process, not of the runner, so it goes
          # in the `env` of `settings`.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"
              }
            }

      - name: Upload execution transcript
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-transcript
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 7

      # A green check has to mean this PR has a Claude review (ADR-0033).
      # The action exits 0 whether or not a report was posted: on 2026-09-22
      # it ended its turn "waiting for subagents" after 56 s and posted
      # nothing (#158). The plugin stops once it finds its own general
      # comment on the PR (a first pass that left only inline comments gets
      # a second one), so the count is over the whole PR, not since this
      # run started: green means "reviewed", not "this push reviewed". The
      # identity alone is not proof of a report: claude.yml
      # answers `@claude` mentions under the same `claude[bot]` login and
      # the action posts its error messages under it too. Two signals are
      # accepted instead: a top-level inline comment by that login — only
      # this workflow mounts the inline-comment MCP tool; claude.yml's
      # answers to `@claude` in a review thread are threaded replies
      # (in_reply_to_id set) and are excluded — or a general comment /
      # review whose body reads as a report ("PR Review" or "Code review";
      # the plugin has posted `## Code review` and a `PR Review:` line
      # without its `##` on real reviews, so the exact `## PR Review:`
      # string is not required).
      # Only runs when the action succeeded: if it failed, the job is
      # already red.
      - name: Require proof that the review was posted
        if: always() && steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TRANSCRIPT: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail

          # The action refuses to run a workflow file that differs from the
          # one on the default branch ("Skipping action due to workflow
          # validation") and exits 0 without a transcript. That is its
          # guard against a PR rewriting this workflow; the consequence is
          # that a PR editing this file cannot get a Claude review before it
          # merges. Red on purpose, with the reason, rather than a green
          # nobody can tell from a review.
          if [ -z "$TRANSCRIPT" ]; then
            echo "::error::Claude Code Review left no transcript: the action skipped itself. If the log of 'Run Claude Code Review' says 'Skipping action due to workflow validation', this PR changes .github/workflows/claude-code-review.yml and the action will not review it until the change is on main — expected for workflow edits, red so the missing review is visible. Any other cause is a silent failure: re-run the job."
            exit 1
          fi

          # --paginate emits one length per page; awk sums them. Review
          # bodies can be null, hence the `// ""`.
          by_claude='select(.user.login == "claude[bot]" or .user.login == "anthropic-code-agent[bot]")'
          count() {
            gh api "repos/$REPO/$1" --paginate --jq "[.[] | $by_claude | $2] | length" \
              | awk '{s += $1} END {print s + 0}'
          }

          INLINE=$(count "pulls/$PR/comments" 'select(.in_reply_to_id == null)')
          GENERAL=$(count "issues/$PR/comments" 'select((.body // "") | test("pr review|code review"; "i"))')
          REVIEWS=$(count "pulls/$PR/reviews" 'select((.body // "") | test("pr review|code review"; "i"))')
          TOTAL=$((INLINE + GENERAL + REVIEWS))

          echo "Claude review signals on PR #$PR: $INLINE top-level inline comments, $GENERAL general comments and $REVIEWS reviews reading as a report."

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Claude Code Review finished successfully but this PR has no review by claude[bot]: no top-level inline comment and no comment or review that reads as a report. A green check with no report is indistinguishable from a review that never happened, so the job fails on purpose. Open the claude-review-transcript artifact: if its last message says it was waiting for a subagent, the agent ended its turn early and a re-run is enough."
            exit 1
          fi
