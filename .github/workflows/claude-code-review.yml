name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the code-review plugin posts the review
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to the v1.0.166 commit (not the floating @v1 tag): an
        # unpinned re-fetch of the action silently regressed the
        # OIDC→app-token exchange on 2026-07-06. Bump this SHA
        # deliberately, the same discipline as the pinned toolchain /
        # Debian snapshot / OpenSSH interop image.
        uses: anthropics/claude-code-action@af0559ee4f514d1ef21826982bed13f7edc3c35e # v1.0.178
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is the plugin's posting switch: its step 7 reads "If
          # --comment argument was NOT provided, stop here. Do not post any
          # GitHub comments." Without it the review runs fully and prints its
          # findings to the job log only.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # --allowedTools is required for posting: in agent mode (explicit
          # prompt) the action only mounts the github_inline_comment MCP
          # server when that tool is named in the action-level allowed tools
          # (install-mcp-server.ts gates on it); the plugin command's own
          # frontmatter cannot grant it. Without this line the review runs
          # but every posting attempt is denied and nothing reaches the PR.
          # Same form as the action repo's own .github/workflows/claude-review.yml.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --model claude-sonnet-4-6
            --append-system-prompt "QuantumSSH is a memory-safe, post-quantum-first SSH server in Rust (pre-alpha). Read CLAUDE.md for the project's review criteria. Classify each PR and apply the right lens: for ADR/RFC docs under docs/adr/ or docs/rfcs/, review the soundness and coherence of the design DECISION against the five MANIFIESTO commitments and the threat model — do NOT hunt for code bugs; for Rust under crates/, apply the hard security rules (no first-party unsafe, no unbounded allocation in the pre-auth path, no legacy crypto or second KEX in the default profile, type-state transport intact, mandated authenticated_identity/executing_uid log fields, key material zeroized); for CI under .github/workflows/, check unpinned actions, excessive token permissions, missing authorization gates and supply-chain risk. Also check that all commit messages follow Conventional Commits: <type>(<optional scope>): <short summary> (types: feat, fix, docs, chore, refactor, test, perf, ci, build, security). A deprecated-but-not-yet-disallowed primitive is NOT legacy: check RFC-0007/RFC-0009 for an open migration window before rejecting one. REPORT FORMAT — score every finding 0-100 and report only >= 80. Open with '**Decision**: 🔴 Blocked | 🟡 Minor changes | 🟢 Approved' and one paragraph of executive summary. Group findings by severity: '🔴 Blocking' (90-100: confirmed bug, vulnerability, exposed secret, violated hard constraint), '🟡 Important' (80-89: real issue affecting behaviour or breaking a stated rule), '💡 Suggestion' (never blocking). Render each as '**[file:line]** — category (confidence: N)' followed by the problem, the fix, and the anchor: every finding cites a CLAUDE.md rule, a threat-model section, or an ADR/RFC. A finding without an anchor is an opinion — drop it. Never report something as missing when your environment cannot observe it: SSH signatures never validate on a runner (gpg.ssh.allowedSignersFile is not configured there), so git log --format=%G? returns N or E for every commit, signed or not — check .commit.verification.verified from the GitHub API, which is what branch protection enforces. Absence of evidence in CI is not evidence of absence; if you cannot verify something, say so as a limitation instead of reporting it as a finding."

      - name: Upload execution transcript
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-transcript
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 7
