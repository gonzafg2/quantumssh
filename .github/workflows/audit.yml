name: Security audit

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-audit requires Cargo.lock, which only exists once a binary
      # or application member crate has been added to the workspace.
      # Skip the audit until then; the guard disappears automatically
      # when Cargo.lock appears at the repository root.
      - name: Detect Cargo.lock
        id: lockfile
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Cargo.lock not present yet; skipping cargo-audit until the workspace has its first lockfile-bearing crate."
          fi

      # ADR-0039: rust-toolchain.toml is the only place a Rust version is
      # named. Pass its exact `channel` to the installer; anything but
      # MAJOR.MINOR.PATCH fails here, so the pin cannot float again
      # silently, and the input is digits and dots only.
      - name: Read pinned toolchain
        if: steps.lockfile.outputs.present == '1'
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          if ! [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::channel must be an exact MAJOR.MINOR.PATCH release (ADR-0039), found '${channel}'"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.lockfile.outputs.present == '1'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache cargo registry, index and target
        if: steps.lockfile.outputs.present == '1'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        if: steps.lockfile.outputs.present == '1'
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        if: steps.lockfile.outputs.present == '1'
        run: cargo audit --deny warnings
