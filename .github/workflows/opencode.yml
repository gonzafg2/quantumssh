name: opencode

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode:
    if: |
      (
        github.event_name == 'pull_request' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          contains(github.event.comment.body, ' /oc') ||
          startsWith(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, ' /opencode') ||
          startsWith(github.event.comment.body, '/opencode')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-pro
          share: false
          prompt: |
            You are reviewing a PR for QuantumSSH — a memory-safe, post-quantum-first SSH server in Rust (pre-alpha). Read CLAUDE.md for the project's review criteria.

            Measure every change against the five MANIFIESTO commitments:
            1. Memory-safe by construction — no first-party `unsafe` (workspace is `unsafe_code = "forbid"`)
            2. Post-quantum by default — only `mlkem768x25519-sha256` KEX in the default profile, hybrid failure must abort
            3. Zero legacy — no RSA, DSA, ECDSA-NIST, CBC modes, `diffie-hellman-group1/14-sha1`, `ssh-rsa`, password auth, or compression
            4. Small surface, sharp edges — reject unjustified dependencies and scope creep
            5. Permanently open — Apache-2.0, no relicensing

            Apply the threat model's hard rules:
            - Pre-auth path is the highest-trust surface: no `unsafe`, bounded allocations, must be fuzzable
            - Fail closed: reject peers that don't offer the hybrid PQ KEX or strict-kex
            - AEAD-only ciphers, keys zeroized after use, never logged
            - Transport is a type-state machine: `Expect<Stage>` exposes only valid messages per stage
            - Audit log fields mandated: `authenticated_identity` and `executing_uid` on every `exec.*` event

            Classify the PR:
            - ADR/RFC docs under `docs/adr/` or `docs/rfcs/`: review design soundness against the commitments and threat model — do NOT hunt for code bugs
            - Rust under `crates/`: apply the hard security rules above
            - CI/workflows: check for unpinned actions, excessive permissions, missing authorization gates, supply-chain risk

            Deprecated is not the same as disallowed: a deprecated-but-not-yet-disallowed primitive is NOT legacy. Check RFC-0007 and RFC-0009 for an open migration window before rejecting one (e.g. `ssh-ed25519` under RFC-0006).

            Work in parallel. Use the `task` tool to fan out independent subagents instead of reviewing serially:
            - one per lens that applies to this PR (design decision / Rust / CI), each returning a list of findings
            - then one validation subagent per finding, to confirm it is real before it reaches the report

            Report only high-signal findings. Anchor each to a CLAUDE.md rule, threat-model section, or ADR. A finding without an anchor is an opinion — drop it.

            Report format — score every finding 0-100 and report only >= 80:

            **Decision**: 🔴 Blocked | 🟡 Minor changes | 🟢 Approved

            One paragraph of executive summary, then findings grouped by severity:
            - `🔴 Blocking` (90-100) — confirmed bug, vulnerability, exposed secret, violated hard constraint
            - `🟡 Important` (80-89) — real issue affecting behaviour or breaking a stated rule
            - `💡 Suggestion` — never blocking

            Render each finding as `**[file:line]** — category (confidence: N)`, followed by the problem, the suggested fix, and the anchor.

            If nothing reaches the threshold, say so explicitly with `**Decision**: 🟢 Approved`.

            When making commits, follow Conventional Commits exactly:
            - Format: `<type>(<optional scope>): <short summary>`
            - Types: feat, fix, docs, chore, refactor, test, perf, ci, build, security
            - Always sign off: `git commit -s -S`
            - A blank line separates subject from body; body explains why, cross-references the issue/RFC.
