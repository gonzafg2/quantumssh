name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same ref so PR
# pushes do not stack up old jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  # Enforce Conventional Commits on every PR. Merge and revert commits
  # are exempt. The job runs on pull_request only — pushes to main skip
  # it (those commits already passed this check in their own PR).
  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Conventional Commits
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|perf|ci|build|security)(\([^)]+\))?!?: .+'
          violations=0
          while IFS= read -r commit_line; do
            # Merge and revert commits are exempt.
            case "$commit_line" in
              Merge*|Revert*) continue ;;
            esac
            if ! echo "$commit_line" | grep -qE "$pattern"; then
              echo "::error::Conventional Commits violation: '$commit_line'"
              violations=$((violations + 1))
            fi
          done < <(git log --format=%s "${{ github.event.pull_request.base.sha }}..HEAD")
          if [ "$violations" -gt 0 ]; then
            echo "::error::${violations} commit(s) do not follow Conventional Commits"
            echo "Expected: <type>(<optional scope>): <summary>"
            echo "Types: feat, fix, docs, chore, refactor, test, perf, ci, build, security"
            exit 1
          fi
          echo "All commits follow Conventional Commits"

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Until the workspace gains its first member crate, cargo refuses
      # to operate on the virtual manifest. We detect this and skip the
      # cargo steps so the job remains green during Phase 0. This guard
      # disappears automatically once `members` in Cargo.toml is non-empty.
      - name: Detect workspace members
        id: members
        shell: bash
        run: |
          count=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              d = tomllib.load(f)
          print(len(d.get("workspace", {}).get("members", [])))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::notice::Workspace has no members yet; skipping fmt/clippy/test/build until the first crate lands."
          fi

      # ADR-0039: rust-toolchain.toml is the only place a Rust version is
      # named. Pass its exact `channel` to the installer; anything but
      # MAJOR.MINOR.PATCH fails here, so the pin cannot float again
      # silently, and the input is digits and dots only.
      - name: Read pinned toolchain
        if: steps.members.outputs.count != '0'
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          if ! [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::channel must be an exact MAJOR.MINOR.PATCH release (ADR-0039), found '${channel}'"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.members.outputs.count != '0'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo registry, index and target
        if: steps.members.outputs.count != '0'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        if: steps.members.outputs.count != '0'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.members.outputs.count != '0'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: steps.members.outputs.count != '0'
        run: cargo test --workspace

      - name: Build (release)
        if: steps.members.outputs.count != '0'
        run: cargo build --workspace --release

      # ADR-0043 §7: the reference unit under a real systemd. The runner's
      # OpenSSH 9.6 lacks the hybrid KEX, so systemd (as PID 1) and the
      # client run in a disposable container built from the interop gate's
      # pinned image; the script installs the release binary built above.
      - name: systemd reference unit
        if: steps.members.outputs.count != '0' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker build -t quantumssh-systemd tests/systemd
          docker run -d --name quantumssh-systemd --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD":/src:ro quantumssh-systemd
          for _ in $(seq 1 150); do
            state="$(docker exec quantumssh-systemd systemctl is-system-running 2>/dev/null || true)"
            case "$state" in running|degraded) break ;; esac
            sleep 0.2
          done
          docker exec quantumssh-systemd bash /src/tests/systemd/run_reference_unit.sh
