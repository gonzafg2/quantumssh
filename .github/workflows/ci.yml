name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same ref so PR
# pushes do not stack up old jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  # Enforce Conventional Commits on every PR. Merge and revert commits
  # are exempt. The job runs on pull_request only — pushes to main skip
  # it (those commits already passed this check in their own PR).
  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Conventional Commits
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|perf|ci|build|security)(\([^)]+\))?!?: .+'
          violations=0
          while IFS= read -r commit_line; do
            # Merge and revert commits are exempt.
            case "$commit_line" in
              Merge*|Revert*) continue ;;
            esac
            if ! echo "$commit_line" | grep -qE "$pattern"; then
              echo "::error::Conventional Commits violation: '$commit_line'"
              violations=$((violations + 1))
            fi
          done < <(git log --format=%s "${{ github.event.pull_request.base.sha }}..HEAD")
          if [ "$violations" -gt 0 ]; then
            echo "::error::${violations} commit(s) do not follow Conventional Commits"
            echo "Expected: <type>(<optional scope>): <summary>"
            echo "Types: feat, fix, docs, chore, refactor, test, perf, ci, build, security"
            exit 1
          fi
          echo "All commits follow Conventional Commits"

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Until the workspace gains its first member crate, cargo refuses
      # to operate on the virtual manifest. We detect this and skip the
      # cargo steps so the job remains green during Phase 0. This guard
      # disappears automatically once `members` in Cargo.toml is non-empty.
      - name: Detect workspace members
        id: members
        shell: bash
        run: |
          count=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              d = tomllib.load(f)
          print(len(d.get("workspace", {}).get("members", [])))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::notice::Workspace has no members yet; skipping fmt/clippy/test/build until the first crate lands."
          fi

      - name: Install Rust toolchain
        if: steps.members.outputs.count != '0'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, index and target
        if: steps.members.outputs.count != '0'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format check
        if: steps.members.outputs.count != '0'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.members.outputs.count != '0'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: steps.members.outputs.count != '0'
        run: cargo test --workspace

      - name: Build (release)
        if: steps.members.outputs.count != '0'
        run: cargo build --workspace --release
