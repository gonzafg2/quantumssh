name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same ref so PR
# pushes do not stack up old jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Until the workspace gains its first member crate, cargo refuses
      # to operate on the virtual manifest. We detect this and skip the
      # cargo steps so the job remains green during Phase 0. This guard
      # disappears automatically once `members` in Cargo.toml is non-empty.
      - name: Detect workspace members
        id: members
        shell: bash
        run: |
          count=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              d = tomllib.load(f)
          print(len(d.get("workspace", {}).get("members", [])))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::notice::Workspace has no members yet; skipping fmt/clippy/test/build until the first crate lands."
          fi

      - name: Install Rust toolchain
        if: steps.members.outputs.count != '0'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, index and target
        if: steps.members.outputs.count != '0'
        uses: Swatinem/rust-cache@v2

      - name: Format check
        if: steps.members.outputs.count != '0'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.members.outputs.count != '0'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: steps.members.outputs.count != '0'
        run: cargo test --workspace

      - name: Build (release)
        if: steps.members.outputs.count != '0'
        run: cargo build --workspace --release
