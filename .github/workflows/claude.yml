name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned to the v1.0.166 commit (not the floating @v1 tag): an
        # unpinned re-fetch of the action silently regressed the
        # OIDC→app-token exchange on 2026-07-06. Bump this SHA
        # deliberately, the same discipline as the pinned toolchain /
        # Debian snapshot / OpenSSH interop image.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # System prompt that applies to every @claude invocation in this repo.
          # Includes the commit conventions so the agent formats commits correctly.
          claude_args: |
            --append-system-prompt "When making commits, follow Conventional Commits: <type>(<optional scope>): <short summary>. Types: feat, fix, docs, chore, refactor, test, perf, ci, build, security. Always sign off and sign: git commit -s -S. Separate subject from body with a blank line; body explains why and cross-references the issue or RFC."

