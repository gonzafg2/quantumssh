name: Interop

# OpenSSH interop hard gate (ADR-0020): every PR must drive a real
# OpenSSH 10.x client through connect → publickey auth → exec → clean
# close against the quantumssh release binary. The default Ubuntu runner
# ships OpenSSH 9.6p1 (no mlkem768x25519-sha256), so the job runs in a
# Debian trixie container, which provides OpenSSH 10.0p1.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  openssh-interop:
    name: openssh-interop
    runs-on: ubuntu-latest
    # ADR-0020: pin the base image by digest (the `debian:trixie-slim`
    # tag is mutable), so the base filesystem is frozen; and pin the
    # OpenSSH client to an exact package version from a frozen
    # snapshot.debian.org timestamp (the install step below) — the
    # hardening ADR-0020 named. Bumping the digest, the snapshot, or the
    # pinned version is a reviewed event.
    container:
      # debian:trixie-slim
      image: debian@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2
    steps:
      - name: Install OpenSSH client + build prerequisites (snapshot-pinned)
        run: |
          # ADR-0020 hardening: freeze the package set to a snapshot.debian.org
          # timestamp, so the OpenSSH client under test is fully reproducible.
          # The gate needs a *fixed* OpenSSH 10.x, not the newest one, so we
          # take whatever trixie `main` carries at the frozen snapshot rather
          # than chasing the security-update revision (a moving target across
          # snapshot suites). Bumping SNAPSHOT is the reviewed event, in
          # lockstep with the digest pin above; the resolved version is logged
          # and asserted to the 10.0p line below.
          SNAPSHOT=20260507T000000Z
          # ca-certificates first, from the base image's own index: the slim
          # image ships no CA bundle, so apt cannot verify snapshot.debian.org
          # over HTTPS without it. It is a cert bundle, not the client under
          # test, so sourcing it from the (digest-pinned) base is fine.
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          # Replace trixie's live sources (deb822 in trixie-slim) with the
          # frozen snapshot; check-valid-until off because archived Release
          # files are past their Valid-Until.
          rm -f /etc/apt/sources.list.d/debian.sources
          # trixie + trixie-updates: the digest-pinned base already carries
          # updated packages (e.g. libc6 deb13u3), so `main` alone conflicts;
          # trixie-updates supplies the matching revisions (and the current
          # openssh-client).
          {
            echo "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/${SNAPSHOT}/ trixie main"
            echo "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/${SNAPSHOT}/ trixie-updates main"
          } > /etc/apt/sources.list.d/snapshot.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            curl gcc libc6-dev openssh-client
          # Record the exact resolved version (frozen by the snapshot) for the
          # audit trail; assert it is the expected 10.0p line.
          echo "resolved openssh-client: $(dpkg-query -W -f='${Version}' openssh-client)"
          ssh -V 2>&1
          ssh -V 2>&1 | grep -qE "OpenSSH_10\.0p[0-9]" \
            || { echo "::error::expected OpenSSH 10.0p line"; ssh -V; exit 1; }
          # The hybrid KEX must be offered, or the gate cannot test it.
          ssh -Q kex | grep -qx "mlkem768x25519-sha256" \
            || { echo "::error::mlkem768x25519-sha256 not offered by this client"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, index and target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --workspace --release

      - name: OpenSSH interop gate
        run: bash tests/interop/run_openssh_client.sh
