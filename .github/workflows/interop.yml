name: Interop

# OpenSSH interop hard gate (ADR-0020): every PR must drive a real
# OpenSSH 10.x client through connect → publickey auth → exec → clean
# close against the quantumssh release binary. The default Ubuntu runner
# ships OpenSSH 9.6p1 (no mlkem768x25519-sha256, no
# ssh-mldsa44-ed25519), so the job runs in a Debian forky container with
# openssh-client pinned to the exact build named below (OpenSSH 10.6p1,
# package 1:10.6p1-1; ADR-0048 on ADR-0034's mechanics).
#
# release.yml also calls it on a release tarball (ADR-0055 §1): the job then
# runs the tarball's binary instead of building one, and records the
# tarball's digest for the attest job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      artifact:
        description: Workflow artifact holding one release tarball, whose binary the gate runs
        type: string
        required: true
      runner:
        description: ubuntu-24.04 or ubuntu-24.04-arm
        type: string
        required: true

concurrency:
  # Under workflow_call, github.workflow and github.ref are the caller's, so
  # the runner keeps the two release legs apart, and a release gate is never
  # cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: ${{ !inputs.artifact }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  openssh-interop:
    name: openssh-interop
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # ADR-0020 / ADR-0034 / ADR-0048: the base image is pinned by digest
    # (the `debian:forky-slim` tag is mutable) and the packages come from the
    # snapshot.debian.org archive state that image was built from, with
    # openssh-client at an exact version and `ssh -V` asserted verbatim in
    # the install step. Bumping the digest, the snapshot timestamp, the
    # package version or the asserted string is one reviewed event
    # ("OpenSSH version bump"); the four move together. The client floor
    # is 10.6p1, the first release that offers ssh-mldsa44-ed25519
    # (ADR-0048); a bump below it supersedes that ADR.
    container:
      # debian:forky-20261027-slim
      image: debian@sha256:04db4720574d184e24353e77e46dbbe4377edad01c9ba50a67aa1473cef9b9d4
    steps:
      - name: Install OpenSSH client + build prerequisites
        env:
          # The image's own /etc/apt/sources.list.d/debian.sources carries,
          # commented out, the snapshot.debian.org timestamp it was built
          # from; SNAPSHOT must be that timestamp (the step checks it), so the
          # base filesystem and the packages come from one frozen archive
          # state. A newer snapshot upgrades libc6 and OpenSSL underneath the
          # client; an older one cannot satisfy libc6-dev (#98). To bump:
          # new digest → read its timestamp into SNAPSHOT → resolve the
          # package version there → re-pin the `ssh -V` string.
          SNAPSHOT: 20261027T000000Z
          OPENSSH_CLIENT_VERSION: '1:10.6p1-1'
          # Exact `ssh -V` of that package from that snapshot. OpenSSL is
          # part of the string, so it pins the library build as well.
          SSH_V_EXPECTED: 'OpenSSH_10.6p1 Debian-1, OpenSSL 3.6.5 29 Sep 2026'
        run: |
          set -euo pipefail
          grep -q "snapshot.debian.org/archive/debian/${SNAPSHOT}" /etc/apt/sources.list.d/debian.sources \
            || { echo "::error::SNAPSHOT=${SNAPSHOT} is not the snapshot this image was built from; see /etc/apt/sources.list.d/debian.sources"; exit 1; }
          # http, not https: the slim image ships no CA bundle, and fetching
          # one from the live mirror first would reintroduce the mixed-state
          # failure of #98. apt verifies the Release signatures (Signed-By);
          # TLS would add confidentiality only. Check-Valid-Until off: the
          # archived Release files of forky-updates and forky-security are
          # past their seven-day validity window.
          cat > /etc/apt/sources.list.d/debian.sources <<EOF
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/${SNAPSHOT}/
          Suites: forky forky-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/${SNAPSHOT}/
          Suites: forky-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
          EOF
          cat > /etc/apt/apt.conf.d/99snapshot <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::Retries "3";
          EOF
          # snapshot.debian.org can fail some files for minutes at a time
          # (#262). apt-get update fails on any missing index, instead of
          # warning and going on, and both it and the download are retried;
          # apt keeps what it already verified, and the install then runs
          # from that cache.
          # ponytail: this loop is copied in tests/systemd/Dockerfile; both
          # go away when the gates move to the image of ADR-0059 (§5 step 2),
          # which retries the same way with tests/gate-image/retry.sh.
          retry() {
            for attempt in 1 2 3 4 5 6 7 8; do
              "$@" && return 0
              [ "$attempt" -lt 8 ] || { echo "::error::failed after $attempt attempts: $*"; return 1; }
              echo "attempt $attempt failed, retrying in 120 s: $*"
              sleep 120
            done
          }
          pkgs=(ca-certificates curl gcc libc6-dev "openssh-client=${OPENSSH_CLIENT_VERSION}")
          retry apt-get update --error-on=any
          retry apt-get install -y --no-install-recommends --download-only "${pkgs[@]}"
          apt-get install -y --no-install-recommends "${pkgs[@]}"
          ssh -V 2>&1
          [ "$(ssh -V 2>&1)" = "$SSH_V_EXPECTED" ] \
            || { echo "::error::ssh -V is not the pinned client; expected '$SSH_V_EXPECTED'"; exit 1; }
          # The hybrid KEX and the composite host key must be offered, or
          # the gate cannot test them.
          ssh -Q kex | grep -qx "mlkem768x25519-sha256" \
            || { echo "::error::mlkem768x25519-sha256 not offered by this client"; exit 1; }
          ssh -Q key | grep -qx "ssh-mldsa44-ed25519" \
            || { echo "::error::ssh-mldsa44-ed25519 not offered by this client"; exit 1; }

      # No token is left in .git/config for the binary under test to find
      # (ADR-0053 §1).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ADR-0039: rust-toolchain.toml is the only place a Rust version is
      # named. Pass its exact `channel` to the installer; anything but
      # MAJOR.MINOR.PATCH fails here, so the pin cannot float again
      # silently, and the input is digits and dots only.
      - name: Read pinned toolchain
        if: ${{ !inputs.artifact }}
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          if ! [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::channel must be an exact MAJOR.MINOR.PATCH release (ADR-0039), found '${channel}'"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: ${{ !inputs.artifact }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # No cache on the release path: a cache written by a pull-request run
      # must not reach a release gate (ADR-0053 §1).
      - name: Cache cargo registry, index and target
        if: ${{ !inputs.artifact }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        if: ${{ !inputs.artifact }}
        run: cargo build --workspace --release

      - name: Download the release tarball
        if: ${{ inputs.artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A workspace path: in a container job, runner.temp names the host's
        # directory, not the container's.
        with:
          name: ${{ inputs.artifact }}
          path: release-artifact

      # The digest is recorded before the binary runs (ADR-0055 §4).
      - name: Extract the release tarball
        if: ${{ inputs.artifact }}
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          cd release-artifact
          tarballs=(quantumssh-*.tar.gz)
          [ "${#tarballs[@]}" -eq 1 ] && [ -f "${tarballs[0]}" ] \
            || { echo "::error::expected exactly one release tarball in $ARTIFACT"; exit 1; }
          sha256sum "${tarballs[0]}" > ../gate-digests.txt
          tar -xzf "${tarballs[0]}"
          echo "QUANTUMSSH_BIN=$PWD/${tarballs[0]%.tar.gz}/quantumssh" >> "$GITHUB_ENV"

      - name: OpenSSH interop gate
        run: bash tests/interop/run_openssh_client.sh

      - name: Record the gated tarball's digest
        if: ${{ inputs.artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-digests-interop-${{ inputs.runner }}
          path: gate-digests.txt
          if-no-files-found: error
