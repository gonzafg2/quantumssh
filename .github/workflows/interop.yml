name: Interop

# OpenSSH interop hard gate (ADR-0020): every PR must drive a real
# OpenSSH 10.x client through connect → publickey auth → exec → clean
# close against the quantumssh release binary. The default Ubuntu runner
# ships OpenSSH 9.6p1 (no mlkem768x25519-sha256, no
# ssh-mldsa44-ed25519), so the job runs in the gate image (ADR-0059): Debian
# forky with openssh-client pinned to 1:10.6p1-1 (OpenSSH 10.6p1; ADR-0048
# on ADR-0034's mechanics), built once by gate-image.yml and verified here
# before it runs.
#
# release.yml also calls it on a release tarball (ADR-0055 §1): the job then
# runs the tarball's binary instead of building one, and records the
# tarball's digest for the attest job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      artifact:
        description: Workflow artifact holding one release tarball, whose binary the gate runs
        type: string
        required: true
      runner:
        description: ubuntu-24.04 or ubuntu-24.04-arm
        type: string
        required: true

concurrency:
  # Under workflow_call, github.workflow and github.ref are the caller's, so
  # the runner keeps the two release legs apart, and a release gate is never
  # cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: ${{ !inputs.artifact }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  # ADR-0059 §4: the gate image is verified on the runner host before any
  # job runs it. If this job fails, openssh-interop is skipped, and a skipped
  # required check does not block a merge; the same verification in ci.yml's
  # build (ubuntu-latest), also required, fails and blocks the PR. On a
  # release, the failure fails the called workflow, so nothing is attested.
  gate-image:
    name: gate-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the gate image
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/gate-image/verify.sh

  openssh-interop:
    name: openssh-interop
    needs: gate-image
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # ADR-0059: the gate image, an OCI index for amd64 and arm64 pinned by
    # digest, built by gate-image.yml from ADR-0048's pin on ADR-0034's
    # mechanics. Its build asserts `ssh -V` verbatim and the two `ssh -Q`
    # names, so the job installs nothing. To move the client, bump
    # tests/gate-image/Dockerfile, then pin the new digest here and in
    # tests/systemd/run_in_docker.sh (ADR-0059 §5). The client floor is
    # 10.6p1 (ADR-0048).
    container:
      image: ghcr.io/gonzafg2/quantumssh-gate@sha256:88a4c0e68037c080d0430f88f63847b9fd7c5c1f369798a9c5233a0b6c903b1e
    steps:
      - name: Gate image client
        run: |
          cat /usr/share/quantumssh-gate/ssh-version
          ssh -V

      # No token is left in .git/config for the binary under test to find
      # (ADR-0053 §1).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ADR-0039: rust-toolchain.toml is the only place a Rust version is
      # named. Pass its exact `channel` to the installer; anything but
      # MAJOR.MINOR.PATCH fails here, so the pin cannot float again
      # silently, and the input is digits and dots only.
      - name: Read pinned toolchain
        if: ${{ !inputs.artifact }}
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          if ! [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=rust-toolchain.toml::channel must be an exact MAJOR.MINOR.PATCH release (ADR-0039), found '${channel}'"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: ${{ !inputs.artifact }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # No cache on the release path: a cache written by a pull-request run
      # must not reach a release gate (ADR-0053 §1).
      - name: Cache cargo registry, index and target
        if: ${{ !inputs.artifact }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        if: ${{ !inputs.artifact }}
        run: cargo build --workspace --release

      - name: Download the release tarball
        if: ${{ inputs.artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A workspace path: in a container job, runner.temp names the host's
        # directory, not the container's.
        with:
          name: ${{ inputs.artifact }}
          path: release-artifact

      # The digest is recorded before the binary runs (ADR-0055 §4).
      - name: Extract the release tarball
        if: ${{ inputs.artifact }}
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          cd release-artifact
          tarballs=(quantumssh-*.tar.gz)
          [ "${#tarballs[@]}" -eq 1 ] && [ -f "${tarballs[0]}" ] \
            || { echo "::error::expected exactly one release tarball in $ARTIFACT"; exit 1; }
          sha256sum "${tarballs[0]}" > ../gate-digests.txt
          tar -xzf "${tarballs[0]}"
          echo "QUANTUMSSH_BIN=$PWD/${tarballs[0]%.tar.gz}/quantumssh" >> "$GITHUB_ENV"

      - name: OpenSSH interop gate
        run: bash tests/interop/run_openssh_client.sh

      - name: Record the gated tarball's digest
        if: ${{ inputs.artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-digests-interop-${{ inputs.runner }}
          path: gate-digests.txt
          if-no-files-found: error
