version: 2
updates:
  # Rust dependencies in the workspace root and any future member crates.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - rust
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    ignore:
      # ADR-0022 pins tokio to the 1.51.x LTS line; a new pin is a
      # superseding-ADR decision, not a bot update. Patch updates
      # (the LTS security backports) stay enabled.
      - dependency-name: tokio
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Major bumps of the RFC-0003 curve/signature primitives are
      # coordinated, ADR-recorded decisions (both dalek crates must
      # move to the same curve25519-dalek line together).
      - dependency-name: x25519-dalek
        update-types:
          - "version-update:semver-major"
      - dependency-name: ed25519-dalek
        update-types:
          - "version-update:semver-major"

  # GitHub Actions used in our workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
