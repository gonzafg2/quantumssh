# cargo-deny configuration.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Default to checking all targets we may build for.
all-features = false

[advisories]
# Vulnerability advisories from RustSec.
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
version             = 2
yanked              = "warn"
ignore              = []

[licenses]
# Allow only well-understood permissive licenses. Copyleft licenses
# (GPL, AGPL, LGPL) are deliberately excluded: this project's license
# commitment forbids absorbing copyleft code into the codebase.
version    = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

# License clarifications: dependencies that are correctly licensed but
# whose metadata cargo-deny cannot infer automatically. Add entries here
# only with justification.
#
# There are currently no clarifications. The Phase 1 stack chosen in
# RFC-0003 is built entirely on pure-Rust RustCrypto/dalek primitive
# crates (ml-kem, x25519-dalek, ed25519-dalek, chacha20poly1305,
# aes-gcm, sha2, hmac, subtle, zeroize), none of which pull in `ring`.
# A `ring` clarification used to live here as a pre-RFC-0003 placeholder;
# it was removed so that, if `ring` ever enters the tree as a transitive
# dependency, cargo-deny surfaces its compound ISC AND MIT AND OpenSSL
# license as a deliberate review event instead of accepting it silently.

[bans]
# Multiple versions of the same crate inflate binary size, expand the
# attack surface, and complicate auditing. We warn rather than deny so
# that transitive dependency mismatches do not block CI before the
# workspace has even shipped a real crate.
multiple-versions = "warn"
wildcards         = "deny"
deny              = []
skip              = []
skip-tree         = []

[sources]
# Refuse to pull from registries or git repositories we have not
# explicitly approved. crates.io is the only registry the workspace uses.
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
